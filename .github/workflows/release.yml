name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1). Must exist or will be created from HEAD.'
        required: true
        default: 'v1.0.1'
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Dorg.gradle.daemon=false"
  JAVA_TOOL_OPTIONS: "-Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8"

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve Tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            echo "Manual dispatch tag: $TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Push tag: $TAG"
          fi
          # normalize: ensure starts with v
          if [[ ! "$TAG" =~ ^v ]]; then TAG="v$TAG"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # versionCode: derive from version (e.g. 1.0.1 -> 10001) or use github run number as fallback
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=${PATCH:-0}
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "$CODE" -eq 0 ]; then CODE=${{ github.run_number }}; fi
          echo "versionCode=$CODE" >> $GITHUB_OUTPUT
          echo "Resolved TAG=$TAG VERSION=$VERSION CODE=$CODE"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Verify Android SDK and install required platforms
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner did not expose ANDROID_HOME}"
          command -v sdkmanager
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Restore and verify permanent release signing key
        env:
          BLACKLIST_KEYSTORE_B64: ${{ secrets.BLACKLIST_KEYSTORE_B64 }}
          BLACKLIST_KEYSTORE_PASSWORD: ${{ secrets.BLACKLIST_KEYSTORE_PASSWORD }}
          BLACKLIST_KEY_ALIAS: ${{ secrets.BLACKLIST_KEY_ALIAS }}
          BLACKLIST_KEY_PASSWORD: ${{ secrets.BLACKLIST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${BLACKLIST_KEYSTORE_B64:?Missing BLACKLIST_KEYSTORE_B64 secret}"
          : "${BLACKLIST_KEYSTORE_PASSWORD:?Missing BLACKLIST_KEYSTORE_PASSWORD secret}"
          : "${BLACKLIST_KEY_ALIAS:?Missing BLACKLIST_KEY_ALIAS secret}"
          : "${BLACKLIST_KEY_PASSWORD:?Missing BLACKLIST_KEY_PASSWORD secret}"

          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/blacklist-release.jks"
          printf '%s' "$BLACKLIST_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          EXPECTED_FILE_SHA256="743f49ab2d72fddbc411d2d131180296892e1f6c0602f52d407a2064f42a783a"
          ACTUAL_FILE_SHA256="$(sha256sum "$KEYSTORE_PATH" | awk '{print $1}')"
          test "$ACTUAL_FILE_SHA256" = "$EXPECTED_FILE_SHA256"

          EXPECTED_CERT_SHA256="45:56:24:F3:16:FB:CD:72:09:9C:31:60:E0:27:D2:0C:A6:42:F8:4D:5C:45:10:89:EE:E1:C8:8C:C1:BF:B4:27"
          ACTUAL_CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$BLACKLIST_KEYSTORE_PASSWORD" -alias "$BLACKLIST_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          echo "BLACKLIST_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Permanent release signing certificate verified: $ACTUAL_CERT_SHA256"

      - name: Run Unit Tests & Lint
        env:
          BLACKLIST_KEYSTORE_PASSWORD: ${{ secrets.BLACKLIST_KEYSTORE_PASSWORD }}
          BLACKLIST_KEY_ALIAS: ${{ secrets.BLACKLIST_KEY_ALIAS }}
          BLACKLIST_KEY_PASSWORD: ${{ secrets.BLACKLIST_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Assemble Release & Debug (tag-linked version, signed)
        env:
          BLACKLIST_KEYSTORE_PASSWORD: ${{ secrets.BLACKLIST_KEYSTORE_PASSWORD }}
          BLACKLIST_KEY_ALIAS: ${{ secrets.BLACKLIST_KEY_ALIAS }}
          BLACKLIST_KEY_PASSWORD: ${{ secrets.BLACKLIST_KEY_PASSWORD }}
        run: |
          echo "Building versionName=${{ steps.tag.outputs.version }} versionCode=${{ steps.tag.outputs.versionCode }}"
          ./gradlew assembleRelease assembleDebug --stacktrace \
            -PversionName="${{ steps.tag.outputs.version }}" \
            -PversionCode="${{ steps.tag.outputs.versionCode }}"
          ls -lh app/build/outputs/apk/release/*.apk
          ls -lh app/build/outputs/apk/debug/*.apk
          echo "--- Verifying both APKs are signed (installable) ---"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -f "$APKSIGNER" ]; then APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"; fi
          if [ ! -f "$APKSIGNER" ]; then APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | head -n1); fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/*.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/*.apk
          echo "--- Release keystore identity was pinned and verified before the build ---"

      - name: Rename & checksum APKs
        id: artifacts
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          # Handle unsigned release apk name
          RELEASE_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          DEBUG_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          cp "$RELEASE_SRC" "BlackList-${TAG}-release.apk"
          cp "$DEBUG_SRC" "BlackList-${TAG}-debug.apk"
          ls -lh BlackList-*.apk
          sha256sum BlackList-*.apk > checksums.txt || shasum -a 256 BlackList-*.apk > checksums.txt
          cat checksums.txt
          echo "release_apk=BlackList-${TAG}-release.apk" >> $GITHUB_OUTPUT
          echo "debug_apk=BlackList-${TAG}-debug.apk" >> $GITHUB_OUTPUT

      - name: Generate professional release notes
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md
          {
            echo "## BlackList $TAG"
            echo
            cat release_notes.md
          } > release_notes.final.md
          mv release_notes.final.md release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "BlackList ${{ steps.tag.outputs.tag }} - Professional Offline Call Blocker"
          body_path: release_notes.md
          append_body: true
          body: |
            ## Download and verification

            Download **BlackList-${{ steps.tag.outputs.tag }}-release.apk** for the signed, R8-minified build, or **BlackList-${{ steps.tag.outputs.tag }}-debug.apk** for development use. After installation, select BlackList as the device's **Call Screening** app when prompted.

            The release workflow verifies both APK signatures with `apksigner verify`. SHA-256 checksums are included as `checksums.txt`. CI built commit `${{ github.sha }}` with JDK 17 and Android API 36.

            ## Privacy commitment

            BlackList remains fully local: this release introduces no cloud service, analytics SDK, tracker, network permission, or new runtime permission.

            **Checksums (SHA-256):**
          files: |
            BlackList-*.apk
            checksums.txt
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
