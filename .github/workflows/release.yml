name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1). Must exist or will be created from HEAD.'
        required: true
        default: 'v1.0.1'
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Dorg.gradle.daemon=false"
  JAVA_TOOL_OPTIONS: "-Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8"

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve Tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            echo "Manual dispatch tag: $TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Push tag: $TAG"
          fi
          # normalize: ensure starts with v
          if [[ ! "$TAG" =~ ^v ]]; then TAG="v$TAG"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # versionCode: derive from version (e.g. 1.0.1 -> 10001) or use github run number as fallback
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=${PATCH:-0}
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "$CODE" -eq 0 ]; then CODE=${{ github.run_number }}; fi
          echo "versionCode=$CODE" >> $GITHUB_OUTPUT
          echo "Resolved TAG=$TAG VERSION=$VERSION CODE=$CODE"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Install Android platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          sdkmanager --list_installed || true

      - name: Ensure keystore for signed release (installable APK)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 9125 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US" || true
          fi
          ls -lh ~/.android/debug.keystore || true
          # Also ensure CI release keystore handling - release will fallback to debug keystore if no custom keystore

      - name: Assemble Release & Debug (tag-linked version, signed)
        run: |
          echo "Building versionName=${{ steps.tag.outputs.version }} versionCode=${{ steps.tag.outputs.versionCode }}"
          ./gradlew assembleRelease assembleDebug --stacktrace \
            -PversionName="${{ steps.tag.outputs.version }}" \
            -PversionCode="${{ steps.tag.outputs.versionCode }}"
          ls -lh app/build/outputs/apk/release/*.apk
          ls -lh app/build/outputs/apk/debug/*.apk
          echo "--- Verifying both APKs are signed (installable) ---"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -f "$APKSIGNER" ]; then APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"; fi
          if [ ! -f "$APKSIGNER" ]; then APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | head -n1); fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/*.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/*.apk

      - name: Rename & checksum APKs
        id: artifacts
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          # Handle unsigned release apk name
          RELEASE_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          DEBUG_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          cp "$RELEASE_SRC" "BlackList-${TAG}-release.apk"
          cp "$DEBUG_SRC" "BlackList-${TAG}-debug.apk"
          ls -lh BlackList-*.apk
          sha256sum BlackList-*.apk > checksums.txt || shasum -a 256 BlackList-*.apk > checksums.txt
          cat checksums.txt
          echo "release_apk=BlackList-${TAG}-release.apk" >> $GITHUB_OUTPUT
          echo "debug_apk=BlackList-${TAG}-debug.apk" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag: $PREV"
          if [ -n "$PREV" ]; then
            echo "## Changes since $PREV" > release_notes.md
            git log --pretty=format:"- %s (%h)" "$PREV..HEAD" >> release_notes.md || echo "- Initial release" >> release_notes.md
          else
            echo "## Initial Release" > release_notes.md
            git log --pretty=format:"- %s (%h)" >> release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "BlackList ${{ steps.tag.outputs.tag }} - Professional Offline Call Blocker"
          body_path: release_notes.md
          append_body: true
          body: |
            ## BlackList ${{ steps.tag.outputs.tag }} - Professional Offline Call Blocker

            > 100% Offline • No cloud • No AI • No trackers • Material Design 3 • Jetpack Compose

            ### 📦 Installation
            Download **BlackList-${{ steps.tag.outputs.tag }}-release.apk** (R8 minified, ~1.5 MB, **signed - installable**) or **-debug.apk** (~18 MB) below.
            Allow “Install unknown apps”, then set as **Call Screening** app when prompted. Both APKs are signed and verified with `apksigner verify`.

            ### ✨ Highlights
            - Silent blocking via `CallScreeningService` (before ringing)
            - Blacklist / Whitelist / Unknown / Private / All-except-Whitelist
            - Advanced Scheduling (time + weekday bitmask, overnight support)
            - Blocked Log with reason & timestamp
            - Dynamic Colors (Material You), Light/Dark/System, RTL Arabic

            ### 🔧 Technical
            - Clean Architecture + MVVM • Room 2.6.1 • Compose BOM 2024.09.02 • Kotlin 2.0.21
            - Min 26 / Target 36 / Gradle 8.13 / AGP 8.13.2 / JDK 17
            - CI built on `${{ github.sha }}` via GitHub Actions

            ### 👨‍💻 Developer
            Alaa (Alaa91H) — Creator of ADM (Advanced Download Manager in Rust) • https://github.com/Alaa91H/Alaa91H

            ---
            **Checksums (SHA-256):**
          files: |
            BlackList-*.apk
            checksums.txt
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
