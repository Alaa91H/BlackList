name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Dorg.gradle.daemon=false"
  JAVA_TOOL_OPTIONS: "-Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore and verify permanent release signing key
        env:
          BLACKLIST_KEYSTORE_B64: ${{ secrets.BLACKLIST_KEYSTORE_B64 }}
          BLACKLIST_KEYSTORE_PASSWORD: ${{ secrets.BLACKLIST_KEYSTORE_PASSWORD }}
          BLACKLIST_KEY_ALIAS: ${{ secrets.BLACKLIST_KEY_ALIAS }}
          BLACKLIST_KEY_PASSWORD: ${{ secrets.BLACKLIST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${BLACKLIST_KEYSTORE_B64:?Missing BLACKLIST_KEYSTORE_B64 secret}"
          : "${BLACKLIST_KEYSTORE_PASSWORD:?Missing BLACKLIST_KEYSTORE_PASSWORD secret}"
          : "${BLACKLIST_KEY_ALIAS:?Missing BLACKLIST_KEY_ALIAS secret}"
          : "${BLACKLIST_KEY_PASSWORD:?Missing BLACKLIST_KEY_PASSWORD secret}"

          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/blacklist-release.jks"
          printf '%s' "$BLACKLIST_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          EXPECTED_FILE_SHA256="743f49ab2d72fddbc411d2d131180296892e1f6c0602f52d407a2064f42a783a"
          ACTUAL_FILE_SHA256="$(sha256sum "$KEYSTORE_PATH" | awk '{print $1}')"
          test "$ACTUAL_FILE_SHA256" = "$EXPECTED_FILE_SHA256"

          EXPECTED_CERT_SHA256="45:56:24:F3:16:FB:CD:72:09:9C:31:60:E0:27:D2:0C:A6:42:F8:4D:5C:45:10:89:EE:E1:C8:8C:C1:BF:B4:27"
          ACTUAL_CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$BLACKLIST_KEYSTORE_PASSWORD" -alias "$BLACKLIST_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          {
            echo "BLACKLIST_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "BLACKLIST_KEYSTORE_PASSWORD=$BLACKLIST_KEYSTORE_PASSWORD"
            echo "BLACKLIST_KEY_ALIAS=$BLACKLIST_KEY_ALIAS"
            echo "BLACKLIST_KEY_PASSWORD=$BLACKLIST_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Permanent release signing certificate verified: $ACTUAL_CERT_SHA256"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Show versions
        run: |
          ./gradlew --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version || true

      - name: Accept Android licenses & install platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          sdkmanager --list_installed || true
          ls -lh "$ANDROID_HOME/platforms" || true

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Assemble Release (R8, signed - installable)
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APKs (must be signed & installable)
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/release/*.apk
          sha256sum app/build/outputs/apk/*/*.apk || shasum -a 256 app/build/outputs/apk/*/*.apk
          echo "--- Verifying APK signatures (both must be signed) ---"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -f "$APKSIGNER" ]; then APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"; fi
          if [ ! -f "$APKSIGNER" ]; then APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | head -n1); fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/*.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/*.apk
          echo "Release APK signature verified against the permanent keystore already pinned before build."
          echo "APK verification done - both APKs are installable"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackList-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload Release APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: BlackList-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            app/build/reports/
            build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
