name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Dorg.gradle.daemon=false"
  JAVA_TOOL_OPTIONS: "-Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Show versions
        run: |
          ./gradlew --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version || true

      - name: Accept Android licenses & install platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          sdkmanager --list_installed || true
          ls -lh "$ANDROID_HOME/platforms" || true

      - name: Lint (non-blocking)
        run: ./gradlew lintDebug --stacktrace --continue
        continue-on-error: true

      - name: Assemble Debug
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Assemble Release (R8, unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APKs
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/release/*.apk
          sha256sum app/build/outputs/apk/*/*.apk || shasum -a 256 app/build/outputs/apk/*/*.apk
          echo "APK verification done"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackList-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: BlackList-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            app/build/reports/
            build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
